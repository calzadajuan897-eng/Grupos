<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>FB Manager Pro</title>
  <style>
    :root { 
      --bg: #000000; 
      --surface: #111111; 
      --surface-variant: #222222;
      --primary: #5A99FF; 
      --secondary: #4CAF50; 
      --warning: #FFEB3B; 
      --error: #FF5252; 
      --text: #EEEEEE; 
      --text-muted: #888888; 
      --border: #444444; 
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Courier New', Courier, monospace; 
      background-color: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 38px 14px 80px 14px; 
      text-transform: uppercase; 
    }

    .brand { 
      text-align: center; 
      margin: 0 0 4px; 
      font-size: 1.4rem; 
      font-weight: bold; 
      color: var(--primary);
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.2);
    }
    
    .stats { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; font-weight: bold; }
    
    /* El Radar de Misión (Estilo 8-Bits) */
    .tracker-box {
      background: #001100;
      border: 2px dashed var(--secondary);
      color: var(--text);
      padding: 10px;
      text-align: center;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 0.85rem;
      line-height: 1.5;
      box-shadow: 4px 4px 0px rgba(76, 175, 80, 0.2);
    }
    
    .panel, .cuenta-card { 
      background: var(--surface); 
      border: 3px solid var(--border); 
      border-radius: 0; 
      padding: 12px; 
      margin-bottom: 16px; 
      box-shadow: 4px 4px 0px rgba(255,255,255,0.1); 
    }
    
    .cuenta-card { padding: 0; overflow: hidden; }
    
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { 
      flex: 1; 
      padding: 12px; 
      background: var(--bg); 
      border: 2px solid var(--border); 
      border-radius: 0; 
      color: var(--text); 
      font-size: 0.9rem; 
      font-family: 'Courier New', Courier, monospace;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    
    button { 
      border: 2px solid var(--border); 
      border-radius: 0; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.75rem; 
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
      transition: all 0.1s;
    }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }
    
    .btn-add { background: var(--primary); color: #000; border-color: var(--primary); padding: 10px 16px; }
    .btn-target { background: var(--error); color: #000; border-color: var(--error); padding: 10px 16px; }
    .btn-shuffle { background: var(--bg); color: var(--primary); border-color: var(--primary); padding: 9px 12px; }
    .btn-action { background: var(--surface-variant); color: var(--text); padding: 9px 12px; }
    .actions-grid { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    
    .msg { padding: 10px 14px; font-size: 0.8rem; margin-top: 10px; display: none; font-weight: bold; border: 2px solid; }
    .msg-error { background: #330000; color: var(--error); border-color: var(--error); }
    .msg-ok { background: #003300; color: var(--secondary); border-color: var(--secondary); }
    
    .cuenta-header { 
      background: var(--surface-variant); 
      padding: 12px 16px; 
      font-weight: bold; 
      display: flex; 
      justify-content: space-between; 
      border-bottom: 3px solid var(--border); 
      font-size: 0.9rem; 
    }
    .cuenta-title { color: var(--primary); }
    .badge { background: var(--bg); color: var(--text); padding: 4px 8px; font-size: 0.8rem; border: 2px solid var(--border); }
    .badge.full { background: #003300; color: var(--secondary); border-color: var(--secondary); }
    
    .link-list { list-style: none; margin: 0; padding: 0; }
    .link-item { padding: 12px; display: flex; flex-direction: column; border-bottom: 2px dashed var(--border); gap: 8px; }
    .link-item:last-child { border-bottom: none; }
    
    .link-item.status-good { border-left: 6px solid var(--secondary); }
    .link-item.status-regular { border-left: 6px solid var(--warning); }
    .link-item.status-bad { border-left: 6px solid var(--error); opacity: 0.7; }
    .link-item.status-bad .link-anchor { text-decoration: line-through; }
    
    .link-item.is-current { background: #001133 !important; border: 2px solid var(--primary) !important; margin: 4px; }
    
    .tag-current { background: var(--primary); color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; margin-left: 8px; border: 1px solid #000; }
    .link-main { display: flex; align-items: center; gap: 8px; }
    .link-num { color: var(--text-muted); font-size: 0.8rem; min-width: 26px; font-weight: bold; }
    .link-anchor { color: var(--primary); text-decoration: none; word-break: break-all; font-size: 0.8rem; flex: 1; cursor: pointer; text-transform: none; }
    
    .item-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-left: 30px; flex-wrap: wrap; }
    .btn-pill { background: var(--bg); border: 2px solid var(--border); color: var(--text-muted); padding: 6px 10px; font-size: 0.7rem; }
    
    .btn-pill.active-good { background: #003300; border-color: var(--secondary); color: var(--secondary); }
    .btn-pill.active-regular { background: #333300; border-color: var(--warning); color: var(--warning); }
    .btn-pill.active-bad { background: #330000; border-color: var(--error); color: var(--error); }
    .btn-pill.active-now { background: var(--primary); color: #000; border-color: var(--primary); }
    .btn-del { color: var(--error); border-color: transparent; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: var(--surface); border: 4px solid var(--primary); padding: 20px; width: 100%; max-width: 400px; box-shadow: 8px 8px 0px rgba(0,0,0,1); }
    .modal-box h3 { margin: 0 0 12px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; }
    
    textarea { width: 100%; height: 160px; background: var(--bg); border: 2px solid var(--border); color: var(--text); font-size: 0.8rem; padding: 12px; margin-top: 8px; outline: none; font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body>

  <div class="brand">Cyber FB Manager Pro</div>
  <div class="stats" id="stats">Cargando...</div>
  
  <!-- NUEVO: RADAR DE MISIÓN FLOTANTE -->
  <div id="trackerBox" class="tracker-box"></div>

  <div class="panel">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="PEGA EL ENLACE AQUÍ...">
      <button class="btn-add" onclick="agregarGrupo()">Añadir</button>
    </div>
    <div id="statusMsg" class="msg"></div>
    <div class="actions-grid">
      <button class="btn-target" onclick="irAlActual()">Ir al Actual</button>
      <button class="btn-shuffle" onclick="aleatorizarGrupos()">Aleatorizar</button>
      <button class="btn-action" onclick="compartirJSON()">Compartir</button>
      <button class="btn-action" onclick="exportarJSON()">Guardar</button>
      <button class="btn-action" onclick="document.getElementById('fileInput').click()">Cargar</button>
      <button class="btn-action" onclick="abrirModalRespaldo()">Texto</button>
      <input type="file" id="fileInput" style="display:none" accept="application/json, text/plain, */*" onchange="importarJSON(event)">
    </div>
  </div>

  <div id="cuentasContainer"></div>

  <!-- Modales -->
  <div id="modalConfirmar" class="modal">
    <div class="modal-box" style="text-align:center;">
      <h3 style="color:var(--error);">Eliminar Grupo</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">Esta acción no se puede deshacer.</p>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn-action" style="padding: 10px 20px;" onclick="cerrarModalConfirmar()">Cancelar</button>
        <button class="btn-add" style="background:var(--error); color:#000; padding: 10px 20px;" onclick="ejecutarEliminacion()">Borrar</button>
      </div>
    </div>
  </div>

  <div id="modalReemplazar" class="modal">
    <div class="modal-box">
      <h3 style="color:var(--primary);">Reemplazar Grupo</h3>
      <input type="text" id="inputNuevoLink" style="width:100%; margin-bottom:16px; margin-top: 8px;">
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button class="btn-action" onclick="cerrarModalReemplazar()">Cancelar</button>
        <button class="btn-add" onclick="ejecutarReemplazo()">Guardar</button>
      </div>
    </div>
  </div>

  <div id="modalTexto" class="modal">
    <div class="modal-box">
      <h3 style="color:var(--primary);">Respaldo en Texto</h3>
      <textarea id="textoRespaldo"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px;">
        <button class="btn-action" onclick="cerrarModalRespaldo()">Cerrar</button>
        <button class="btn-add" onclick="restaurarDesdeTexto()">Restaurar</button>
      </div>
    </div>
  </div>

  <!-- PLUGIN BRIDGE -->
  <script src="cordova.js"></script>

  <script>
    function vibrar(patron = 20) { if (navigator.vibrate) { try { navigator.vibrate(patron); } catch(e) {} } }

    document.addEventListener('deviceready', () => {
      if (window.StatusBar) { 
        StatusBar.overlaysWebView(false);
        StatusBar.backgroundColorByHexString('#000000'); 
        StatusBar.styleLightContent(); 
      }
    }, false);

    let rawStorage = localStorage.getItem('cyber_fb_list');
    let grupos = [];
    if (rawStorage) {
      try { 
        let p = JSON.parse(rawStorage); 
        grupos = p.map(i => typeof i === 'string' ? { url: i, status: 'none' } : i); 
      } catch(e) { grupos = []; }
    }

    let urlActual = localStorage.getItem('cyber_fb_current_url') || '';
    let idOperacion = null;
    let agregadosSesion = 0; // NUEVO: Contador de grupos de esta sesión

    function limpiarID(url) { return (url || '').replace(/[\u200e\u200f\s]/g, '').replace(/^https?:\/\/(www\.|m\.)?facebook\.com\/groups\//i, '').split('/')[0].split('?')[0].toLowerCase(); }
    
    function mostrarMensaje(texto, tipo) { 
      const msg = document.getElementById('statusMsg'); 
      msg.textContent = texto; 
      msg.className = `msg msg-${tipo}`; 
      msg.style.display = 'block'; 
      setTimeout(() => { msg.style.display = 'none'; }, 4000); 
    }
    
    function marcarActual(url) { vibrar(20); urlActual = url; localStorage.setItem('cyber_fb_current_url', url); render(); }
    
    function irAlActual() {
      vibrar(35); if (!urlActual) return mostrarMensaje('Sin grupo actual', 'error');
      const el = document.querySelector('.is-current');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); mostrarMensaje('Enfocando...', 'ok'); } else { mostrarMensaje('No encontrado en la lista', 'error'); }
    }

    function abrirEnFB(url) {
      if (!url || url === 'undefined') return mostrarMensaje('Enlace dañado', 'error');
      marcarActual(url); vibrar(30);
      if (window.cordova && window.cordova.InAppBrowser) { cordova.InAppBrowser.open(url, '_system'); } 
      else { const clean = url.replace(/^https?:\/\//i, ''); window.location.href = `intent://${clean}#Intent;scheme=https;package=com.facebook.lite;end`; }
    }
    
    // NUEVO: Función inteligente del Tracker
    function actualizarTracker() {
      const tracker = document.getElementById('trackerBox');
      
      // Si ya completaste los 25
      if (agregadosSesion === 25) {
        tracker.style.display = 'block';
        tracker.style.borderColor = 'var(--secondary)';
        tracker.innerHTML = '<span style="color: var(--secondary); font-size: 1.1rem;">¡MISIÓN CUMPLIDA! 👾</span>';
        setTimeout(() => { 
          tracker.style.display = 'none'; 
          agregadosSesion = 26; // Para que no vuelva a salir hasta reiniciar app
        }, 3000);
        return;
      }
      
      // Si te pasaste de 25, se queda oculto para no estorbar
      if (agregadosSesion > 25) {
        tracker.style.display = 'none';
        return;
      }

      tracker.style.display = 'block';
      let faltan = 25 - (grupos.length % 25);
      if (faltan === 25 && grupos.length > 0) faltan = 0;

      let html = `Misión: <span style="color: var(--primary);">${agregadosSesion}</span>/25 AÑADIDOS HOY`;
      
      if (faltan > 0) {
        html += `<br><span style="font-size:0.7rem; color: var(--warning);">FALTAN ${faltan} GRUPOS PARA CERRAR LA CUENTA ACTUAL</span>`;
      } else if (grupos.length > 0) {
        html += `<br><span style="font-size:0.7rem; color: var(--secondary);">LAS CUENTAS ESTÁN LLENAS (MÚLTIPLO DE 25)</span>`;
      } else {
        html += `<br><span style="font-size:0.7rem; color: var(--text-muted);">AÚN NO HAY GRUPOS EN LA LISTA</span>`;
      }
      
      tracker.innerHTML = html;
    }

    function render() {
      localStorage.setItem('cyber_fb_list', JSON.stringify(grupos));
      const container = document.getElementById('cuentasContainer'); container.innerHTML = '';
      const total = grupos.length; const totalCuentas = Math.ceil(total / 25) || 1;
      document.getElementById('stats').textContent = `TOTAL: ${total} GRUPOS • CUENTAS: ${totalCuentas}`;

      actualizarTracker(); // Mantiene el radar actualizado en cada renderizado

      let cuentaIndex = 1;
      for (let i = 0; i < total; i += 25) {
        const chunk = grupos.slice(i, i + 25);
        const card = document.createElement('div'); card.className = 'cuenta-card';
        card.innerHTML = `<div class="cuenta-header"><span class="cuenta-title">CUENTA ${cuentaIndex}</span><span class="badge ${chunk.length === 25 ? 'full' : ''}">${chunk.length}/25</span></div>`;
        const ul = document.createElement('ul'); ul.className = 'link-list';

        chunk.forEach((item, localIdx) => {
          const globalIdx = i + localIdx;
          const li = document.createElement('li');
          const isCurr = item.url === urlActual;
          const st = item.status === 'good' ? 'status-good' : (item.status === 'bad' ? 'status-bad' : (item.status === 'regular' ? 'status-regular' : ''));
          
          li.className = `link-item ${st} ${isCurr ? 'is-current' : ''}`;
          li.innerHTML = `
            <div class="link-main"><span class="link-num">${localIdx + 1}.</span><span class="link-anchor" onclick="abrirEnFB('${item.url}')">${item.url}</span>${isCurr ? '<span class="tag-current">ACTUAL</span>' : ''}</div>
            <div class="item-toolbar">
              <button class="btn-pill ${isCurr ? 'active-now' : ''}" onclick="marcarActual('${item.url}')">Fijar</button>
              <button class="btn-pill ${item.status === 'good' ? 'active-good' : ''}" onclick="toggleCalificacion(${globalIdx}, 'good')">Bien</button>
              <button class="btn-pill ${item.status === 'regular' ? 'active-regular' : ''}" onclick="toggleCalificacion(${globalIdx}, 'regular')">Medio</button>
              <button class="btn-pill ${item.status === 'bad' ? 'active-bad' : ''}" onclick="toggleCalificacion(${globalIdx}, 'bad')">Mal</button>
              <button class="btn-pill" onclick="abrirModalReemplazar(${globalIdx})">Cambio</button>
              <button class="btn-pill btn-del" onclick="abrirModalConfirmar(${globalIdx})">✕</button>
            </div>
          `;
          ul.appendChild(li);
        });
        card.appendChild(ul); container.appendChild(card); cuentaIndex++;
      }
    }

    function toggleCalificacion(idx, estado) { 
      vibrar(estado === 'good' ? [15, 30, 15] : (estado === 'regular' ? [20, 20] : 40)); 
      grupos[idx].status = grupos[idx].status === estado ? 'none' : estado; 
      render(); 
    }
    
    function aleatorizarGrupos() {
      vibrar([25, 40, 25, 40, 30]); if (grupos.length <= 1) return;
      for (let i = grupos.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [grupos[i], grupos[j]] = [grupos[j], grupos[i]]; }
      render(); mostrarMensaje('Grupos aleatorizados', 'ok');
    }

    function agregarGrupo() {
      const input = document.getElementById('urlInput'); 
      let raw = input.value.trim().replace(/[\u200e\u200f]/g, ''); 
      if (!raw) return;
      
      if (!raw.startsWith('http')) raw = 'https://facebook.com/groups/' + raw.replace(/^\/+/, '');
      const idNuevo = limpiarID(raw);
      
      if (!idNuevo) { vibrar([50, 40, 50]); return mostrarMensaje('Enlace no válido', 'error'); }
      
      for (let i = 0; i < grupos.length; i++) { 
        if (limpiarID(grupos[i].url) === idNuevo) { 
          vibrar([60, 50, 60]); 
          return mostrarMensaje('Grupo repetido', 'error'); 
        } 
      }
      
      vibrar(25); 
      
      const indexMalo = grupos.findIndex(g => g.status === 'bad');
      
      if (indexMalo !== -1) {
        grupos[indexMalo] = { url: raw, status: 'none' };
        mostrarMensaje('Un grupo fue reemplazado', 'ok');
      } else {
        grupos.push({ url: raw, status: 'none' });
        mostrarMensaje('Añadido', 'ok');
      }
      
      // NUEVO: Sumar al contador de la misión cada vez que añades exitosamente
      if (agregadosSesion < 25) {
        agregadosSesion++;
      }
      
      input.value = ''; 
      render();
    }

    function abrirModalConfirmar(idx) { vibrar(30); idOperacion = idx; document.getElementById('modalConfirmar').style.display = 'flex'; }
    function cerrarModalConfirmar() { document.getElementById('modalConfirmar').style.display = 'none'; idOperacion = null; }
    function ejecutarEliminacion() { vibrar(50); if (idOperacion !== null) { if (grupos[idOperacion].url === urlActual) { urlActual = ''; localStorage.removeItem('cyber_fb_current_url'); } grupos.splice(idOperacion, 1); cerrarModalConfirmar(); render(); mostrarMensaje('Eliminado', 'ok'); } }

    function abrirModalReemplazar(idx) { vibrar(20); idOperacion = idx; document.getElementById('inputNuevoLink').value = grupos[idx].url; document.getElementById('modalReemplazar').style.display = 'flex'; }
    function cerrarModalReemplazar() { document.getElementById('modalReemplazar').style.display = 'none'; idOperacion = null; }
    function ejecutarReemplazo() {
      const nuevo = document.getElementById('inputNuevoLink').value.trim().replace(/[\u200e\u200f]/g, ''); if (!nuevo || idOperacion === null) return;
      let link = nuevo.startsWith('http') ? nuevo : 'https://facebook.com/groups/' + nuevo.replace(/^\/+/, '');
      vibrar(25); if (grupos[idOperacion].url === urlActual) { urlActual = link; localStorage.setItem('cyber_fb_current_url', link); }
      grupos[idOperacion] = { url: link, status: 'none' }; cerrarModalReemplazar(); render(); mostrarMensaje('Reemplazado', 'ok');
    }

    async function compartirJSON() {
      vibrar(30); const jsonStr = JSON.stringify(grupos, null, 2);
      if (window.plugins && window.plugins.socialsharing) {
        const base64Data = "data:application/json;base64," + btoa(unescape(encodeURIComponent(jsonStr)));
        window.plugins.socialsharing.share(null, 'cyber_grupos.json', base64Data, null);
      } else { mostrarMensaje('Plugin no detectado', 'error'); }
    }

    function exportarJSON() {
      vibrar(25);
      const jsonStr = JSON.stringify(grupos, null, 2);

      if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
        var permissions = cordova.plugins.permissions;
        permissions.checkPermission(permissions.WRITE_EXTERNAL_STORAGE, function(status) {
          if (status.hasPermission) {
            escribirEnMemoria(jsonStr);
          } else {
            mostrarMensaje('Solicitando permiso...', 'ok');
            permissions.requestPermission(permissions.WRITE_EXTERNAL_STORAGE, function(statusReq) {
              if (statusReq.hasPermission) { escribirEnMemoria(jsonStr); } else { mostrarMensaje('Permiso denegado', 'error'); }
            }, function() { mostrarMensaje('Error de permisos', 'error'); });
          }
        });
      } else {
        const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr); a.download = "cyber_grupos.json"; document.body.appendChild(a); a.click(); a.remove();
      }
    }

    function escribirEnMemoria(texto) {
      mostrarMensaje('Creando archivo...', 'ok');
      window.resolveLocalFileSystemURL(cordova.file.externalRootDirectory + 'Download/', function(dir) {
        dir.getFile("cyber_grupos.json", {create: true, exclusive: false}, function(fileEntry) {
          fileEntry.createWriter(function(fileWriter) {
            fileWriter.onwriteend = function() { mostrarMensaje('Guardado en Descargas', 'ok'); vibrar([30,50,30]); };
            fileWriter.onerror = function() { mostrarMensaje('Error al escribir', 'error'); };
            fileWriter.write(new Blob([texto], {type: 'application/json'}));
          }, function(){ mostrarMensaje('Error en writer', 'error'); });
        }, function(){ mostrarMensaje('Error al crear archivo', 'error'); });
      }, function(){ mostrarMensaje('Error al abrir Descargas', 'error'); });
    }

    function importarJSON(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = ev => {
        try { 
          const res = JSON.parse(ev.target.result); 
          if (Array.isArray(res)) { 
            vibrar([20, 30, 20]); 
            grupos = res.map(i => {
              if (typeof i === 'string') return { url: i, status: 'none' };
              if (i.link && !i.url) return { url: i.link, status: 'none' }; 
              return i;
            });
            render(); 
            mostrarMensaje('Base de datos cargada', 'ok'); 
          } 
        } catch(err) { mostrarMensaje('Archivo no válido', 'error'); }
      }; r.readAsText(f);
    }
    
    function abrirModalRespaldo() { vibrar(20); document.getElementById('textoRespaldo').value = JSON.stringify(grupos); document.getElementById('modalTexto').style.display = 'flex'; }
    function cerrarModalRespaldo() { document.getElementById('modalTexto').style.display = 'none'; }
    
    function restaurarDesdeTexto() {
      try { 
        const val = JSON.parse(document.getElementById('textoRespaldo').value.trim()); 
        if (Array.isArray(val)) { 
          vibrar([20, 30, 20]); 
          grupos = val.map(i => {
            if (typeof i === 'string') return { url: i, status: 'none' };
            if (i.link && !i.url) return { url: i.link, status: 'none' }; 
            return i;
          });
          render(); 
          cerrarModalRespaldo(); 
          mostrarMensaje('Restaurado', 'ok'); 
        } 
      } catch(e) { alert('Error: Formato incorrecto.'); }
    }

    render();
  </script>
</body>
</html>
