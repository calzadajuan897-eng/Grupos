name: Compilar APK Grupos FB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova, Plugins y Compilar APK
        run: |
          npm install -g cordova
          cordova create app com.cyber.fbmanager "Grupos FB"
          cd app
          rm -rf www/*
          
          # Aqui le decimos que tome el archivo con el (1) y lo convierta en index.html
          cp "../grupos_material.html" www/index.html
          
          if [ -f ../icon.png ]; then
            cp ../icon.png icon.png
          fi

          # Plugins nativos (Archivos, Permisos, Compartir, Interfaz)
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-x-socialsharing
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions

          # Configuracion de Android
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.cyber.fbmanager" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Grupos FB</name>
              <description>Cyber FB Manager Pro</description>
              <author email="dev@cyberfb.local">CyberFB</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="fb:*" />
              <allow-intent href="intent:*" />
              
              <preference name="StatusBarBackgroundColor" value="#05070a" />
              <preference name="StatusBarStyle" value="lightcontent" />
              <preference name="BackgroundColor" value="#05070a" />
              <preference name="AndroidPersistentFileLocation" value="Compatibility" />
              
              <icon src="icon.png" />
          </widget>
          EOF

          cordova platform add android
          cordova build android --debug
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Grupos_FB.apk

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: Grupos_FB-Instalador
          path: app/platforms/android/app/build/outputs/apk/debug/Grupos_FB.apk
          
