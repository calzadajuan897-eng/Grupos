name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova y Compilar APK
        run: |
          npm install -g cordova
          cordova create app com.cyber.fbmanager CyberFB
          cd app
          rm -rf www/*
          cp ../grupos.html www/grupos.html
          cordova platform add android
          cordova build android --debug

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: CyberFB-Instalador
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
